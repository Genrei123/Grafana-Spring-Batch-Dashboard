services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spring-batch-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      # Must satisfy SQL Server's complexity rule (8+ chars, 3 of
      # upper/lower/digit/symbol). Matches spring.datasource.password's
      # default in application.yaml - change both together.
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-SpringBatch_2024!}
    ports:
      - "1433:1433"
    volumes:
      # Persists BATCH_JOB_EXECUTION etc. across container restarts so the
      # Grafana panels have history to show. Drop this (or `docker compose
      # down -v`) to start from a clean database.
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: spring-batch-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      # Lets the container reach the app running on the host via mvnw
      # (Linux Docker needs this explicitly; Docker Desktop already has it).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: spring-batch-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API (Grafana reads from this)
      - "4318:4318"   # OTLP/HTTP receiver - matches management.otlp.tracing.endpoint
      - "4317:4317"   # OTLP/gRPC receiver
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: spring-batch-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - mssql
    restart: unless-stopped

volumes:
  mssql-data:
