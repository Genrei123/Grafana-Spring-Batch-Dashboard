server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          # Matches management.otlp.tracing.endpoint in application.yaml
          # (http://localhost:4318/v1/traces) once the app talks to this
          # container instead of nothing.
        grpc:

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Single-binary mode: one container does ingest, storage and query - fine
# for local learning. A real deployment splits these into separate
# components (distributor/ingester/querier/compactor).
